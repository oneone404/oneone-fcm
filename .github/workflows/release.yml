name: Build module release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify restored engine and WebUI
        shell: bash
        run: |
          node --check module/webroot/app.js
          node tests/verify-webui.mjs
          for script in module/*.sh module/tools/patcher module/webroot/cgi-bin/exec; do
            bash -n "$script"
          done

      - name: Verify tag and module version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version=//p' module/module.prop)"
          test "$VERSION" = "${GITHUB_REF_NAME}"

      - name: Build ReSukiSU module ZIP
        shell: bash
        run: |
          cd module
          zip -r "../OneOne-FCM-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## v/ { if (started) exit; started=1; next } started { print }' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" "OneOne-FCM-${GITHUB_REF_NAME}.zip" \
            --title "OneOne FCM ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
