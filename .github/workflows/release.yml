name: Build module release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install native-helper build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build native catalog and framework patcher
        run: node tools/build-tools.mjs

      - name: Test Core, framework gates and UI
        run: node tests/verify.mjs

      - name: Verify tag and module version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version=//p' module/module.prop)"
          test "$VERSION" = "${GITHUB_REF_NAME}"

      - name: Build ReSukiSU module ZIP
        shell: bash
        run: |
          cd module
          zip -r "../OneOne-FCM-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk 'BEGIN {section=0} /^## / {if (section) exit; section=1; next} section {print}' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" "OneOne-FCM-${GITHUB_REF_NAME}.zip" \
            --title "OneOne FCM ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
